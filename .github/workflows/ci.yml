name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[test,pty]"
      - name: Lint
        run: |
          echo "No ruff configuration is present; skipping ruff."
      - name: Type check
        run: |
          echo "No mypy configuration is present; skipping mypy."
      - name: Pytest and contract tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[test,pty]"
      - name: Install frontend
        run: npm ci
      - name: Install Playwright
        run: npx --workspace @hermes/desktop-ui-frontend playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run e2e

  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows bundler
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - name: Install frontend
        run: npm ci
      - name: Build Tauri
        run: npm --workspace @hermes/desktop-tauri run tauri -- build --no-sign
